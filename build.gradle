plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.9'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

// Natives bundled in the mod jar (jar-in-jar) so players need a single file.
def nativePlatforms = ['linux-x86_64', 'linux-arm64', 'windows-x86_64', 'macosx-x86_64', 'macosx-arm64']

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation "io.lindstrom:m3u8-parser:${project.m3u8_parser_version}"
    implementation "org.bytedeco:javacv:${project.javacv_version}"
    implementation "org.bytedeco:javacpp:${project.javacv_version}"
    implementation "org.bytedeco:ffmpeg:${project.ffmpeg_version}"

    include "io.lindstrom:m3u8-parser:${project.m3u8_parser_version}"
    include "org.bytedeco:javacv:${project.javacv_version}"
    include "org.bytedeco:javacpp:${project.javacv_version}"
    include "org.bytedeco:ffmpeg:${project.ffmpeg_version}"
    nativePlatforms.each { platform ->
        include "org.bytedeco:javacpp:${project.javacv_version}:${platform}"
        include "org.bytedeco:ffmpeg:${project.ffmpeg_version}:${platform}"
    }

    // Host natives so `runClient` works in dev.
    runtimeOnly "org.bytedeco:javacpp:${project.javacv_version}:linux-x86_64"
    runtimeOnly "org.bytedeco:ffmpeg:${project.ffmpeg_version}:linux-x86_64"
    runtimeOnly "org.bytedeco:javacpp:${project.javacv_version}:windows-x86_64"
    runtimeOnly "org.bytedeco:ffmpeg:${project.ffmpeg_version}:windows-x86_64"
}

// CurseForge rejects any upload that holds a .exe or .bat file. The FFmpeg native jars ship the
// ffmpeg and ffprobe command-line programs beside the libraries; the mod only loads the libraries
// through JavaCV and never runs a program, so they are dropped from the jars nested in the mod.
def ffmpegPrograms = ['ffmpeg', 'ffmpeg.exe', 'ffprobe', 'ffprobe.exe']
tasks.named('processIncludeJars') {
    doLast {
        outputs.files.asFileTree.matching { include 'ffmpeg-*.jar' }.each { nested ->
            java.nio.file.FileSystems.newFileSystem(nested.toPath()).withCloseable { fs ->
                java.nio.file.Files.walk(fs.getPath('/')).withCloseable { paths ->
                    paths.filter { java.nio.file.Files.isRegularFile(it) && it.fileName.toString() in ffmpegPrograms }
                            .toList()
                            .each { java.nio.file.Files.delete(it) }
                }
            }
        }
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
