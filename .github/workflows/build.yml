name: Build

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Build
        run: ./gradlew build

      # The mod jar bundles FFmpeg natives (~130 MB), so keep retention short.
      - uses: actions/upload-artifact@v4
        with:
          name: webstreamer-${{ github.sha }}
          path: build/libs/*.jar
          retention-days: 7
