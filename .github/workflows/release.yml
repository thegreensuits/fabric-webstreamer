name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches mod_version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match mod_version=$version in gradle.properties" >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Build
        run: ./gradlew build

      - name: Publish to CurseForge and GitHub Releases
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-generate-changelog: true

          files: |
            build/libs/!(*-sources).jar
          name: WebStreamer ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          version-type: release
          loaders: fabric
          game-versions: "26.1.2"
          java: "25"
